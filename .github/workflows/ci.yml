name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # Offline unit tests — no Firestore emulator, no network.
  # These are the fast, always-run gate.
  # -------------------------------------------------------------------
  unit-offline:
    name: Offline unit tests
    runs-on: ubuntu-latest
    env:
      RESEARCH_MATCH_DISABLE_OPENALEX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run offline unit tests
        run: uv run pytest tests/test_engines.py tests/test_openalex.py -q

  # -------------------------------------------------------------------
  # Full suite under the Firestore emulator.
  # Runs the entire test tree (offline + emulator-backed) so integration
  # coverage is exercised on CI. The conftest guard also protects this job:
  # if the emulator were unreachable the emulator tests skip instead of hang.
  # -------------------------------------------------------------------
  full-emulator:
    name: Full suite (Firestore emulator)
    runs-on: ubuntu-latest
    needs: unit-offline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (Temurin 21)
        # firebase-tools no longer starts the emulators on a JDK older than 21.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run full suite under Firestore emulator
        # conftest.py points the SDK at 127.0.0.1:8080 with project research-match-dev;
        # run the emulator under the same project id (singleProjectMode is enabled).
        run: firebase emulators:exec --only firestore --project research-match-dev "uv run pytest -q"
