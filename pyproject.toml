[project]
name = "research-match"
version = "2.3.0"
description = "MCP server that connects isolated researchers via AI originality scoring and bilateral matching."
authors = [
    { name = "faustojdb", email = "faustojdb@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "MIT" }
urls = { homepage = "https://github.com/faustojdb/ResearchMatch" }
keywords = ["research", "mcp", "ai", "matching", "originality", "collaboration"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
research-match = "research_match_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
