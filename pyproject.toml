[project]
name = "research-match"
version = "3.0.0"
description = "MCP server that connects isolated researchers via AI originality scoring and bilateral matching."
authors = [
    { name = "faustojdb", email = "faustojdb@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "BSL-1.1" }
urls = { homepage = "https://github.com/faustojdb/ResearchMatch" }
keywords = ["research", "mcp", "ai", "matching", "originality", "collaboration"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "sentence-transformers>=3.0.0",
    "typing_extensions>=4.0",
    "firebase-admin>=6.0.0",
    "google-cloud-firestore>=2.16.0",
    "algoliasearch>=4.0.0",
    "PyJWT>=2.0.0",
    "cryptography>=3.4",
]

[project.scripts]
research-match = "src.research_match_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-asyncio>=1.0"]
